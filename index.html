*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Pretendard Variable',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
input,textarea,button,select{font-family:inherit}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}
::-webkit-scrollbar{width:0;height:0}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0deg)}25%{transform:translate(-50%,-50%) rotate(-2deg)}75%{transform:translate(-50%,-50%) rotate(2deg)}}
@keyframes pinShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-in{animation:fadeIn .3s ease both}
@media print{
  @page{size:A4;margin:6mm 14mm 6mm 14mm}
  html,body{width:100%!important;height:auto!important;overflow:visible!important;background:#fff!important;color:#1a1a1a!important;font-size:10pt!important}
  #app,#app *{overflow:visible!important}

  [data-pdf-hide]{display:none!important}
  iframe{display:none!important}
  [style*="position: fixed"],[style*="position:fixed"]{display:none!important}
  [style*="gradient"]{background:none!important}
  /* Full A4 width */
  [data-report-container]{height:auto!important;min-height:0!important;overflow:visible!important;background:#fff!important}
  [data-report-inner]{max-width:100%!important;padding:0!important}
  /* Cover page - show in print, full page */
  [data-cover-page]{display:block!important;break-after:page!important;page-break-after:always!important}
  [data-cover-page]>div{min-height:calc(100vh - 12mm)!important}
  /* Header - compact in print */
  [data-report-header]{padding:0 0 10pt!important;margin-bottom:14pt!important;border-bottom:1.5pt solid #1a1a1a!important}
  /* Card sections flat */
  [data-print-section],[data-photo-section]{
    background:none!important;border:none!important;border-radius:0!important;
    padding:0!important;margin-bottom:14pt!important;
  }
  /* Sections 2-7: keep entire section together on one page */
  [data-print-section]{break-inside:avoid!important;page-break-inside:avoid!important}
  /* Force page break before section 2 */
  [data-page-break]{break-before:page!important;page-break-before:always!important}
  /* Section titles */
  [data-sec-title]{
    font-size:11pt!important;padding-bottom:5pt!important;margin-bottom:8pt!important;
    border-bottom:1.5pt solid #333!important;
    break-after:avoid!important;page-break-after:avoid!important;
  }
  [data-sec-title] span:first-child{
    background:#1a1a1a!important;color:#fff!important;
    width:20pt!important;height:20pt!important;font-size:9pt!important;border-radius:4pt!important;
  }
  /* Data rows */
  [data-report-row]{padding:5pt 0!important;border-bottom:0.5pt solid #ddd!important;font-size:9.5pt!important}
  [data-report-row]>div:first-child{font-size:8pt!important;color:#666!important;margin-bottom:2pt!important}
  [data-report-row]>div:nth-child(2){font-size:10pt!important;color:#1a1a1a!important}
  /* Photo label */
  [data-print-photo]{margin-bottom:8pt!important}
  /* Photo label stays with first photo row */
  [data-photo-label]{break-after:avoid!important;page-break-after:avoid!important}
  /* Photo grid */
  [data-photo-grid]{gap:6pt!important}
  /* Photo rows - NO break constraints to prevent overlap */
  [data-photo-row]{gap:6pt!important;align-items:center!important}
  /* Photo cells: contain mode for mixed portrait/landscape */
  [data-photo-cell]{
    aspect-ratio:auto!important;height:155pt!important;
    border-radius:3pt!important;border:0.5pt solid #ddd!important;
    background:#fafafa!important;
  }
  /* Single odd photo smaller */
  [data-photo-cell]:only-child{height:120pt!important}
  [data-photo-cell] img{object-fit:contain!important;width:100%!important;height:100%!important}
  /* Row inline photos */
  [data-row-photos]{gap:8pt!important;margin-top:8pt!important}
  [data-row-photos]>div{
    width:120pt!important;height:90pt!important;
    border-radius:3pt!important;border:0.5pt solid #ddd!important;
    background:#fafafa!important;
  }
  [data-row-photos]>div img{object-fit:contain!important}
  /* Sketch */
  [data-sketch-wrap]{border-radius:3pt!important;margin-bottom:8pt!important;background:#f0f0f0!important}
  /* Measurement floor plan */
  [data-measure-photo] [data-photo-row]{flex-direction:column!important}
  [data-measure-photo] [data-photo-cell]{height:auto!important;max-height:520pt!important;flex:none!important;background:transparent!important}
  [data-measure-photo] [data-photo-cell] img{object-fit:contain!important}
  /* Images */
  img{max-width:100%!important}
  /* Footer */
  [data-report-footer]{margin-top:16pt!important;padding-top:10pt!important;border-top:0.5pt solid #ccc!important}

// ==================== Image Compression ====================
function compressImage(file, maxSize=1200, quality=0.7){
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width,height} = img;
        if(width>maxSize||height>maxSize){
          if(width>height){height=Math.round(height*(maxSize/width));width=maxSize;}
          else{width=Math.round(width*(maxSize/height));height=maxSize;}
        }
        const c = document.createElement("canvas");
        c.width=width;c.height=height;
        c.getContext("2d").drawImage(img,0,0,width,height);
        resolve(c.toDataURL("image/jpeg",quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

let uploadTotal = 0, uploadDone = 0;

async function uploadPhoto(dataUrl, reportId, idx){
  const resp = await fetch(dataUrl);
  const blob = await resp.blob();
  const path = `reports/${reportId}/photo_${idx}_${Date.now()}.jpg`;
  const ref = storage.ref(path);
  await ref.put(blob, {contentType:'image/jpeg'});
  uploadDone++;
  savingMsg = `사진 업로드 ${uploadDone}/${uploadTotal}`;
  // Update button text without full re-render
  const btn = document.querySelector('[data-save-btn]');
  if(btn) btn.innerHTML = `<div style="width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div> ${savingMsg}`;
  return await ref.getDownloadURL();
}

async function saveReport(){
  if(!db || !storage){
    alert('Firebase가 연결되지 않았습니다. 배포 후 사용해주세요.');
    return;
  }
  if(saving) return;
  saving = true;
  render();

  try {
    // Collect all photos to upload
    const photoFields = [];
    const collectPhotos = (obj, prefix) => {
      for(const [k,v] of Object.entries(obj)){
        if(Array.isArray(v) && v.length > 0 && typeof v[0]==='string' && v[0].startsWith('data:')){
          photoFields.push({path:`${prefix}.${k}`, photos:v});
        } else if(typeof v==='string' && v.startsWith('data:') && k!=='video'){
          photoFields.push({path:`${prefix}.${k}`, photos:[v], single:true});
        } else if(v && typeof v==='object' && !Array.isArray(v) && k!=='walls' && k!=='doors' && k!=='pins'){
          // skip nested objects that aren't photo containers
        }
      }
    };

    // Create new or use existing doc
    let reportId;
    let docRef;
    if(editingId){
      reportId = editingId;
      docRef = db.collection('reports').doc(editingId);
      await docRef.update({
        info: data.info,
        status: 'uploading',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    } else {
      docRef = await db.collection('reports').add({
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        info: data.info,
        status: 'uploading'
      });
      reportId = docRef.id;
    }

    // Deep clone data for upload
    const uploadData = JSON.parse(JSON.stringify(data));

    // Count total photos to upload for progress
    const countDataUrls = arr => (arr||[]).filter(u=>typeof u==='string'&&u.startsWith('data:')).length;
    uploadTotal = countDataUrls(data.photos.exterior) + countDataUrls(data.photos.interior)
      + (data.sketch.drawing?.startsWith('data:')?1:0) + (data.sketch.bgPhoto?.startsWith('data:')?1:0)
      + countDataUrls(data.measure.floorPlan);
    for(const k of ['waterMeterPhotos','waterSupplyPhotos','drainagePhotos','ductPhotos','gasEntryPhotos','gasHeaterPhotos','notesPhotos']) uploadTotal+=countDataUrls(data.facility[k]);
    for(const k of ['panelPhotos','hvacPhotos','notesPhotos']) uploadTotal+=countDataUrls(data.electric[k]);
    for(const k of ['parkingPhotos','materialRoutePhotos','stairElevatorPhotos','buildingProtectionPhotos','notesPhotos']) uploadTotal+=countDataUrls(data.construction[k]);
    for(const k of ['illegalBuildingPhotos','leakPhotos','notesPhotos']) uploadTotal+=countDataUrls(data.etc[k]);
    uploadDone = 0;
    savingMsg = uploadTotal > 0 ? `사진 업로드 0/${uploadTotal}` : '저장 중...';
    render();

    // Collect ALL photos that need uploading
    let photoIdx = 0;
    const uploadJobs = []; // {resolve, dataUrl}

    const queueArr = (arr) => {
      return arr.map(dataUrl => {
        if(dataUrl.startsWith('data:')){
          const idx = photoIdx++;
          return new Promise(async (resolve) => {
            const url = await uploadPhoto(dataUrl, reportId, idx);
            resolve(url);
          });
        }
        return Promise.resolve(dataUrl);
      });
    };

    // Queue all photo uploads
    const extP = queueArr(data.photos.exterior);
    const intP = queueArr(data.photos.interior);
    const skDrawP = (data.sketch.drawing && data.sketch.drawing.startsWith('data:')) ? uploadPhoto(data.sketch.drawing, reportId, photoIdx++).then(u=>{uploadData.sketch.drawing=u;}) : null;
    const skBgP = (data.sketch.bgPhoto && data.sketch.bgPhoto.startsWith('data:')) ? uploadPhoto(data.sketch.bgPhoto, reportId, photoIdx++).then(u=>{uploadData.sketch.bgPhoto=u;}) : null;

    const facJobs = {};
    for(const k of ['waterMeterPhotos','waterSupplyPhotos','drainagePhotos','ductPhotos','gasEntryPhotos','gasHeaterPhotos','notesPhotos']){
      if(data.facility[k]?.length) facJobs[k] = queueArr(data.facility[k]);
    }
    const elecJobs = {};
    for(const k of ['panelPhotos','hvacPhotos','notesPhotos']){
      if(data.electric[k]?.length) elecJobs[k] = queueArr(data.electric[k]);
    }
    const conJobs = {};
    for(const k of ['parkingPhotos','materialRoutePhotos','stairElevatorPhotos','buildingProtectionPhotos','notesPhotos']){
      if(data.construction[k]?.length) conJobs[k] = queueArr(data.construction[k]);
    }
    const etcJobs = {};
    for(const k of ['illegalBuildingPhotos','leakPhotos','notesPhotos']){
      if(data.etc[k]?.length) etcJobs[k] = queueArr(data.etc[k]);
    }
    const fpP = data.measure.floorPlan?.length ? queueArr(data.measure.floorPlan) : null;

    // Execute ALL uploads in parallel
    const [extUrls, intUrls] = await Promise.all([Promise.all(extP), Promise.all(intP)]);
    uploadData.photos.exterior = extUrls;
    uploadData.photos.interior = intUrls;
    if(skDrawP) await skDrawP;
    if(skBgP) await skBgP;
    for(const [k,jobs] of Object.entries(facJobs)) uploadData.facility[k] = await Promise.all(jobs);
    for(const [k,jobs] of Object.entries(elecJobs)) uploadData.electric[k] = await Promise.all(jobs);
    for(const [k,jobs] of Object.entries(conJobs)) uploadData.construction[k] = await Promise.all(jobs);
    for(const [k,jobs] of Object.entries(etcJobs)) uploadData.etc[k] = await Promise.all(jobs);
    if(fpP) uploadData.measure.floorPlan = await Promise.all(fpP);

    // Save complete data - remove non-serializable fields
    savingMsg = '데이터 저장 중...';
    const btn2 = document.querySelector('[data-save-btn]');
    if(btn2) btn2.innerHTML = `<div style="width:18px;height:18px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div> ${savingMsg}`;
    const saveData = {};
    for(const [key, val] of Object.entries(uploadData)){
      if(val !== undefined && val !== null) saveData[key] = val;
    }
    // Remove _custom flags from panel entries
    if(saveData.electric?.panelEntries){
      saveData.electric.panelEntries = saveData.electric.panelEntries.map(e => ({phase:e.phase,amps:e.amps}));
    }

    await docRef.update({
      ...saveData,
      status: 'complete',
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // Show share link
    const shareUrl = `${location.origin}/report/${reportId}`;
    saving = false;
    editingId = reportId;
    reportsList = null;
    // Update local data with uploaded URLs to avoid re-upload on next save
    data = JSON.parse(JSON.stringify(uploadData));
    clearDraft();
    render();
    showShareModal(shareUrl, reportId);

  } catch(err){
    console.error('Save error:', err);
    saving = false;
    render();
    setTimeout(()=>alert('저장 중 오류가 발생했습니다:\n' + err.message), 100);
  }
}

async function loadReport(id){
  try {
    const doc = await db.collection('reports').doc(id).get();
    if(!doc.exists){
      alert('보고서를 찾을 수 없습니다.');
      viewMode = false;

    data = {
      info: d.info || makeInitialData().info,
      photos: d.photos || makeInitialData().photos,
      fire: d.fire || makeInitialData().fire,
      sketch: d.sketch || makeInitialData().sketch,
      facility: d.facility || makeInitialData().facility,
      electric: d.electric || makeInitialData().electric,
      construction: d.construction || makeInitialData().construction,
      etc: d.etc || makeInitialData().etc,
      measure: d.measure || makeInitialData().measure,
    };
    viewMode = true;

    render();
  } catch(err){

  }
}

function openLightbox(photos, startIdx){
  let idx = startIdx || 0;
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,0.95);display:flex;flex-direction:column;touch-action:pan-y';

  const closeLB = () => {
    if(document.body.contains(ov)) ov.remove();
    document.removeEventListener('keydown',onKey);
    window.removeEventListener('popstate',onPop);
  };

  // Push history state so back button closes lightbox
  history.pushState({lightbox:true},'');
  const onPop = () => closeLB();
  window.addEventListener('popstate',onPop);

  function renderLB(){
    ov.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;flex-shrink:0">
        <div style="color:#999;font-size:14px">${idx+1} / ${photos.length}</div>
        <button id="lbClose" style="background:none;border:none;color:#fff;font-size:28px;cursor:pointer;padding:4px;line-height:1">✕</button>
      </div>
      <div id="lbBody" style="flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0">
        ${photos.length>1&&idx>0?'<button id="lbPrev" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)">‹</button>':''}
        <img src="${photos[idx]}" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;user-select:none">
        ${photos.length>1&&idx<photos.length-1?'<button id="lbNext" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.15);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)">›</button>':''}
      </div>
      ${photos.length>1?`<div style="display:flex;justify-content:center;gap:6px;padding:12px 20px;flex-shrink:0">${photos.map((_,i)=>`<div style="width:${i===idx?'20':'6'}px;height:6px;border-radius:3px;background:${i===idx?'#fff':'#555'};transition:all .2s"></div>`).join('')}</div>`:''}`;

    ov.querySelector('#lbClose').onclick = () => { history.back(); };
    const prev = ov.querySelector('#lbPrev');
    const next = ov.querySelector('#lbNext');
    if(prev) prev.onclick = e => { e.stopPropagation(); idx--; renderLB(); };
    if(next) next.onclick = e => { e.stopPropagation(); idx++; renderLB(); };

    // Swipe support
    let sx=null,ex=null;
    const body = ov.querySelector('#lbBody');
    body.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;ex=null;},{passive:true});
    body.addEventListener('touchmove',e=>{ex=e.touches[0].clientX;},{passive:true});
    body.addEventListener('touchend',()=>{
      if(sx!=null&&ex!=null){
        const d=sx-ex;
        if(Math.abs(d)>50){
          if(d>0&&idx<photos.length-1){idx++;renderLB();}
          else if(d<0&&idx>0){idx--;renderLB();}
        }
      }
      sx=ex=null;
    });
    body.onclick = e => { if(e.target===body) history.back(); };
  }

  // Keyboard
  const onKey = e => { if(e.key==='Escape'){history.back();} else if(e.key==='ArrowRight'&&idx<photos.length-1){idx++;renderLB();} else if(e.key==='ArrowLeft'&&idx>0){idx--;renderLB();} };
  document.addEventListener('keydown',onKey);

  document.body.appendChild(ov);
  renderLB();
}

// ==================== Helpers ====================
function h(tag, attrs, ...children){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(k==='style' && typeof v==='object') Object.assign(el.style, v);
    else if(k.startsWith('on')) el[k.toLowerCase()] = v;
    else el.setAttribute(k, v);
  }
  for(const c of children.flat()){
    if(c==null||c===false) continue;
    el.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  }
  return el;
}

    dotsDiv.innerHTML += `<div style="width:14px;height:14px;border-radius:50%;border:2px solid ${T.border3};background:transparent"></div>`;
  }
  box.appendChild(dotsDiv);

  // Numpad
  let entered = '';
  const updateDots = () => {
    const dots = dotsDiv.querySelectorAll('div');
    dots.forEach((d2,i) => {
      d2.style.background = i < entered.length ? T.accent : 'transparent';
      d2.style.borderColor = i < entered.length ? T.accent : T.border3;
    });
  };

  const numpad = h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'10px',maxWidth:'240px',margin:'0 auto'}});
  [1,2,3,4,5,6,7,8,9,null,0,'⌫'].forEach(n => {
    if(n===null){ numpad.appendChild(h('div',{})); return; }
    const btn = h('button',{style:{padding:'16px 0',borderRadius:'12px',border:`1px solid ${T.border3}`,background:'transparent',color:T.text,fontSize:n==='⌫'?'18px':'20px',fontWeight:'600',cursor:'pointer',fontFamily:'inherit'}});
    btn.textContent = n==='⌫' ? '⌫' : String(n);
    btn.onclick = () => {
      if(n==='⌫'){ entered=entered.slice(0,-1); updateDots(); return; }
      if(entered.length>=4) return;
      entered += String(n);
      updateDots();
      if(entered.length===4){
        if(entered===APP_PIN){
          isUnlocked=true;
          render();
        } else {
          // Wrong PIN - shake & reset
          dotsDiv.style.animation='pinShake .4s ease';
          setTimeout(()=>{entered='';updateDots();dotsDiv.style.animation='';},500);
        }
      }
    };
    numpad.appendChild(btn);
  });
  box.appendChild(numpad);

  container.appendChild(box);
  return container;
}

  const newBtn = h('button',{style:{width:'100%',padding:'18px 20px',borderRadius:'14px',border:'none',background:T.accent,color:T.accentText,fontSize:'16px',fontWeight:'700',cursor:'pointer',marginBottom:'32px',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}});
  newBtn.innerHTML = `<span style="font-size:20px">+</span> 새 보고서 작성`;
  newBtn.onclick = () => {
    data = makeInitialData();
    editingId = null;
    step = 0;
    showReport = false;
    clearDraft();
    navigateTo('wizard');
  };
  inner.appendChild(newBtn);

  // Draft resume
  var draft = loadDraft();
  if(draft && draft.data.info.siteName){

    draftCard.onclick = function(){
      data = draft.data;
      step = draft.step;
      editingId = draft.editingId;
      showReport = false;
      navigateTo('wizard');
    };
    var delDraft = h('button',{style:{marginTop:'8px',background:'none',border:'none',color:T.text4,fontSize:'12px',cursor:'pointer',padding:'0'}},'삭제');
    delDraft.onclick = function(e){ e.stopPropagation(); clearDraft(); render(); };
    draftCard.appendChild(delDraft);
    inner.appendChild(draftCard);
  }

  // Reports list
  const listHeader = h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}});
  listHeader.innerHTML = `<div style="font-size:15px;font-weight:600;color:${T.text}">저장된 보고서</div>`;

  if(reportsList===null){
    // Loading
    const refreshBtn = h('div',{style:{fontSize:'13px',color:T.text3}},'불러오는 중...');
    listHeader.appendChild(refreshBtn);
    inner.appendChild(listHeader);
    fetchReports();
  } else if(reportsList.length===0){
    inner.appendChild(listHeader);
    inner.appendChild(h('div',{style:{textAlign:'center',padding:'40px 0',color:T.text4,fontSize:'14px'}},'아직 저장된 보고서가 없습니다'));
  } else {
    const refreshBtn = h('button',{style:{background:'none',border:'none',color:T.text3,fontSize:'13px',cursor:'pointer',padding:'4px 8px'}});
    refreshBtn.textContent = '새로고침';
    refreshBtn.onclick = () => { reportsList=null; render(); };
    listHeader.appendChild(refreshBtn);
    inner.appendChild(listHeader);

    const list = h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}});
    reportsList.forEach(report=>{
      const info = report.info || {};
      const date = info.date || '';
      const siteName = info.siteName || '이름 없음';
      const manager = info.manager || '';
      const photoCount = (report.photos?.exterior?.length||0) + (report.photos?.interior?.length||0);

      const card = h('div',{style:{padding:'16px 18px',borderRadius:'14px',background:T.cardBg,border:`1px solid ${T.cardBorder}`,cursor:'pointer',transition:'transform .15s'}});

      card.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div style="flex:1;min-width:0">
            <div style="font-size:16px;font-weight:600;color:${T.text};margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${siteName}</div>
            <div style="font-size:13px;color:${T.text3}">${date}${manager?' · '+manager:''}</div>
            <div style="font-size:12px;color:${T.text4};margin-top:4px">📷 ${photoCount}장</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:2px">
            <button class="del-btn" style="width:32px;height:32px;border-radius:8px;border:1px solid ${T.border3};background:transparent;color:${T.text4};font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center">🗑</button>
            <div style="font-size:18px;color:${T.text4}">›</div>
          </div>
        </div>`;

      // Delete button
      card.querySelector('.del-btn').onclick = (e) => {
        e.stopPropagation();
        if(confirm(`"${siteName}" 보고서를 삭제하시겠습니까?\n사진 포함 완전히 삭제됩니다.`)){
          deleteReport(report.id);
        }
      };

      card.onmouseenter = () => { card.style.transform='translateY(-1px)'; };
      card.onmouseleave = () => { card.style.transform=''; };

      card.onclick = () => {
        // Load and view this report
        $app.innerHTML = `<div style="min-height:100vh;background:${T.bg};display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="width:32px;height:32px;border:3px solid ${T.border3};border-top-color:${T.accent};border-radius:50%;animation:spin 1s linear infinite"></div><div style="color:${T.text3};font-size:14px">불러오는 중...</div></div>`;
        loadReportForEdit(report.id);
      };

      list.appendChild(card);
    });
    inner.appendChild(list);
  }

  container.appendChild(inner);
  return container;
}

// Load report for viewing from home
async function deleteReport(id){
  try {
    // Delete all photos in Storage under reports/{id}/
    const storageRef = storage.ref(`reports/${id}`);
    try {
      const files = await storageRef.listAll();
      await Promise.all(files.items.map(f => f.delete()));
    } catch(e){ /* no files or folder, ok */ }

    // Delete Firestore document
    await db.collection('reports').doc(id).delete();

    // Refresh list
    reportsList = reportsList ? reportsList.filter(r=>r.id!==id) : null;
    render();
  } catch(err){
    console.error('Delete error:', err);
    alert('삭제 실패: '+err.message);
  }
}

async function loadReportForEdit(id){
  try {
    const doc = await db.collection('reports').doc(id).get();
    if(!doc.exists){ alert('보고서를 찾을 수 없습니다.'); currentView='home'; render(); return; }
    const d = doc.data();
    data = {
      info: d.info || makeInitialData().info,
      photos: d.photos || makeInitialData().photos,
      fire: d.fire || makeInitialData().fire,
      sketch: d.sketch || makeInitialData().sketch,
      facility: d.facility || makeInitialData().facility,
      electric: d.electric || makeInitialData().electric,
      construction: d.construction || makeInitialData().construction,
      etc: d.etc || makeInitialData().etc,
      measure: d.measure || makeInitialData().measure,
    };
    editingId = id;
    viewMode = false;
    showReport = true;
    navigateTo('report');
  } catch(err){
    console.error('Load error:', err);
    alert('불러오기 실패: '+err.message);
    currentView='home';
    render();
  }
}

// ==================== Wizard Render ====================
function renderWizard(){
  const currentStep = STEPS[step];
  const progress = ((step+1)/STEPS.length)*100;

  const container = h('div',{style:{minHeight:'100vh',background:T.bg,color:T.text,fontFamily:"'Pretendard Variable',-apple-system,sans-serif",display:'flex',flexDirection:'column',transition:'background .3s,color .3s',overflowY:'auto',height:'100vh'}});

  // Header
  const header = h('div',{style:{padding:'16px 20px 0',position:'sticky',top:'0',zIndex:'10',background:T.bg}});
  header.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px">
        <button id="wizHome" style="background:none;border:none;color:${T.text3};font-size:18px;cursor:pointer;padding:0;line-height:1">‹</button>
        <div style="font-size:11px;color:${T.text3};letter-spacing:1.5px;text-transform:uppercase">!G 실측보고서 작성기</div>
      </div>
      <div style="font-size:12px;color:${T.text3}">${step+1} / ${STEPS.length}</div>
    </div>
    <div style="height:2px;background:${T.bg4};border-radius:1px;overflow:hidden"><div style="height:100%;width:${progress}%;background:${T.accent};transition:width .4s ease"></div></div>`;
  header.querySelector('#wizHome').onclick = () => {
    if(confirm('목록으로 돌아가시겠습니까? 저장하지 않은 내용은 사라집니다.')){
      history.back();
    }
  };

  // Dots
  const dots = h('div',{style:{display:'flex',gap:'4px',justifyContent:'center',padding:'14px 0 8px'}});
  STEPS.forEach((s,i) => {
    const dot = h('button',{style:{width:i===step?'24px':'8px',height:'8px',borderRadius:'4px',border:'none',cursor:'pointer',background:i===step?T.accent:i<step?T.dotDone:T.dotInactive,transition:'all .3s ease'}});
    dot.onclick = () => { step=i; render(true); };
    dots.appendChild(dot);
  });
  header.appendChild(dots);
  container.appendChild(header);

  // Content
  const content = h('div',{style:{flex:'1',padding:'12px 20px 140px'}});
  content.classList.add('fade-in');

  // Step title
  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <span style="font-size:24px">${currentStep.icon}</span>
      <div><h2 style="margin:0;font-size:20px;font-weight:700">${currentStep.title}</h2>
      <div style="font-size:12px;color:${T.text3}">Step ${step+1}</div></div>
    </div>`;

  // Step content
  const stepContent = renderStepContent(currentStep.id);
  content.appendChild(stepContent);
  container.appendChild(content);

  // Bottom nav
  const nav = h('div',{style:{position:'fixed',bottom:'0',left:'0',right:'0',padding:'16px 20px',paddingBottom:'max(16px, env(safe-area-inset-bottom))',background:T.gradientBottom,display:'flex',gap:'10px',zIndex:'20'}});

  if(step>0){
    const prevBtn = h('button',{style:{flex:'0 0 auto',padding:'14px 20px',borderRadius:'12px',border:`1px solid ${T.border3}`,background:'transparent',color:T.text2,fontSize:'15px',cursor:'pointer',fontWeight:'500'}});
    prevBtn.textContent='이전';
    prevBtn.onclick=()=>{step--;render(true);};
    nav.appendChild(prevBtn);
  }

  const nextBtn = h('button',{style:{flex:'1',padding:'14px 0',borderRadius:'12px',border:'none',background:T.accent,color:T.accentText,fontSize:'15px',fontWeight:'700',cursor:'pointer'}});
  nextBtn.textContent = step===STEPS.length-1 ? '보고서 미리보기' : '다음';
  nextBtn.onclick = () => {
    if(step<STEPS.length-1){step++;render(true);}
    else{showReport=true;navigateTo('report');}
  };
  nav.appendChild(nextBtn);
  container.appendChild(nav);


  return container;
}

// ==================== Step Content ====================
function renderStepContent(id){
  const wrap = h('div',{});
  switch(id){
    case 'info': renderStepInfo(wrap); break;
    case 'photos': renderStepPhotos(wrap); break;
    case 'fire': renderStepFire(wrap); break;
    case 'sketch': renderStepSketch(wrap); break;
    case 'facility': renderStepFacility(wrap); break;
    case 'electric': renderStepElectric(wrap); break;
    case 'construction': renderStepConstruction(wrap); break;
    case 'etc': renderStepEtc(wrap); break;
    case 'measure': renderStepMeasure(wrap); break;
  }
  return wrap;
}

// -- Field builder helpers --
function makeField(wrap, label, value, onChange, opts={}){
  const {placeholder='',type='text',multiline=false,options=null,photos=null,onAddPhoto=null,onRemovePhoto=null,sketchBtn=null} = opts;
  const box = h('div',{style:{marginBottom:'16px'}});
  box.appendChild(h('div',{style:{fontSize:'13px',color:T.text2,marginBottom:'6px',fontWeight:'500'}},label));

  if(options){
    const chips = h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}});
    options.forEach(o=>{
      const active = value===o;
      const btn = h('button',{style:{padding:'8px 16px',borderRadius:'20px',border:active?`1.5px solid ${T.accent}`:`1px solid ${T.chipBorder}`,background:active?T.chipActive:T.chipInactive,color:active?T.chipActiveText:T.chipInactiveText,fontSize:'14px',cursor:'pointer',fontWeight:active?'600':'400'}},o);
      btn.onclick=()=>{onChange(o);render();};
      chips.appendChild(btn);
    });
    box.appendChild(chips);
    if(placeholder){
      const isChipVal = options.includes(value);
      const inp = h('input',{type:'text',style:{...inputStyle(),fontSize:'14px',marginTop:'8px'},placeholder});
      inp.value = isChipVal ? '' : (value||'');
      inp.oninput = e=>{onChange(e.target.value);};
      inp.onfocus = () => { if(options.includes(value)){onChange('');render();} };
      box.appendChild(inp);
    }
  } else if(multiline){
    const ta = h('textarea',{style:{...inputStyle(),resize:'vertical'},rows:'3',placeholder});
    ta.value = value||'';
    ta.oninput = e=>onChange(e.target.value);
    box.appendChild(ta);
  } else {
    const inp = h('input',{type,style:inputStyle(),placeholder});
    inp.value = value||'';
    inp.oninput = e=>onChange(e.target.value);
    box.appendChild(inp);
  }

  // Photos + sketchBtn row
  if(photos!==null || sketchBtn){
    const row = h('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginTop:'6px'}});
    if(photos!==null) row.appendChild(makeInlinePhotos(photos,onAddPhoto,onRemovePhoto));
    if(sketchBtn) row.appendChild(sketchBtn);
    box.appendChild(row);
  }

  wrap.appendChild(box);
}

  const {placeholder='직접 입력',options=[],photos=null,onAddPhoto=null,onRemovePhoto=null,sketchBtn=null} = opts;
  const box = h('div',{style:{marginBottom:'16px'}});
  box.appendChild(h('div',{style:{fontSize:'13px',color:T.text2,marginBottom:'6px',fontWeight:'500'}},label));

  const chips = h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'8px'}});

    if(currentPin){

  renderPin();
}

function openDateModal(value, onChange){
  const today = new Date();
  const sel = value ? new Date(value+'T00:00:00') : null;
  let viewYear = sel?.getFullYear() || today.getFullYear();
  let viewMonth = sel?.getMonth() ?? today.getMonth();

  const overlay = document.createElement('div');
  overlay.style.cssText = `position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:20px`;

  function renderCalendar(){
    const days=['일','월','화','수','목','금','토'];
    const firstDay = new Date(viewYear,viewMonth,1).getDay();
    const daysInMonth = new Date(viewYear,viewMonth+1,0).getDate();
    const monthLabel = `${viewYear}년 ${viewMonth+1}월`;
    const currentSel = value ? new Date(value+'T00:00:00') : null;

    let html = `<div onclick="event.stopPropagation()" style="background:${T.bg2};border-radius:16px;padding:20px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.3)">`;
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px"><button id="calPrev" style="width:36px;height:36px;border-radius:8px;border:none;background:${T.bg3};color:${T.text};font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">‹</button><div style="font-size:16px;font-weight:700;color:${T.text}">${monthLabel}</div><button id="calNext" style="width:36px;height:36px;border-radius:8px;border:none;background:${T.bg3};color:${T.text};font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center">›</button></div>`;
    html += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:8px">`;
    days.forEach(d2=>html+=`<div style="text-align:center;font-size:12px;color:${T.text3};padding:4px 0;font-weight:600">${d2}</div>`);
    html += `</div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">`;
    for(let i=0;i<firstDay;i++) html+=`<div></div>`;
    for(let day=1;day<=daysInMonth;day++){
      const isToday = viewYear===today.getFullYear()&&viewMonth===today.getMonth()&&day===today.getDate();
      const isSel = currentSel&&viewYear===currentSel.getFullYear()&&viewMonth===currentSel.getMonth()&&day===currentSel.getDate();
      html += `<button class="cal-day" data-day="${day}" style="width:100%;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;font-size:14px;font-weight:${isSel?700:isToday?600:400};background:${isSel?T.accent:isToday?T.bg4:'transparent'};color:${isSel?T.accentText:T.text};display:flex;align-items:center;justify-content:center">${day}</button>`;
    }
    html += `</div>`;
    if(value) html += `<div style="margin-top:12px;text-align:center"><button id="calClear" style="background:none;border:none;color:${T.text3};font-size:13px;cursor:pointer">날짜 삭제</button></div>`;
    html += `</div>`;
    overlay.innerHTML = html;

    overlay.querySelector('#calPrev').onclick = e => {e.stopPropagation();if(viewMonth===0){viewYear--;viewMonth=11;}else viewMonth--;renderCalendar();};
    overlay.querySelector('#calNext').onclick = e => {e.stopPropagation();if(viewMonth===11){viewYear++;viewMonth=0;}else viewMonth++;renderCalendar();};
    overlay.querySelectorAll('.cal-day').forEach(btn=>{
      btn.onclick = e => {
        e.stopPropagation();
        const day = btn.dataset.day;
        const m = String(viewMonth+1).padStart(2,'0'), d2 = String(day).padStart(2,'0');
        onChange(`${viewYear}-${m}-${d2}`);
        overlay.remove();
        render();
      };
    });
    const clearBtn = overlay.querySelector('#calClear');
    if(clearBtn) clearBtn.onclick = e => {e.stopPropagation();onChange('');overlay.remove();render();};
  }

  overlay.onclick = () => { overlay.remove(); };
  document.body.appendChild(overlay);
  renderCalendar();
}

function renderStepSketch(wrap){
  const d2 = data.sketch;

  // Init polygon if needed
  if(!d2.polygon || d2.polygon.length < 3){
    d2.polygon = [{x:15,y:15},{x:85,y:15},{x:85,y:85},{x:15,y:85}];
  }

  // Mode toggle
  const modeRow = h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}});
  ['draw','photo'].forEach(m=>{
    const active = d2.mode===m;
    const btn = h('button',{style:{flex:'1',padding:'10px 0',borderRadius:'10px',border:active?`1.5px solid ${T.accent}`:`1px solid ${T.chipBorder}`,background:active?T.chipActive:'transparent',color:active?T.chipActiveText:T.text2,fontSize:'14px',cursor:'pointer',fontWeight:'600'}},m==='draw'?'✏️ 직접 스케치':'📷 사진 위 마킹');
    btn.onclick=()=>{d2.mode=m;render();};
    modeRow.appendChild(btn);
  });
  wrap.appendChild(modeRow);

  if(d2.mode==='photo' && !d2.bgPhoto){
    const uploadBtn = h('button',{style:{width:'100%',padding:'40px 0',borderRadius:'10px',border:`2px dashed ${T.border3}`,background:'transparent',color:T.text3,fontSize:'14px',cursor:'pointer',marginBottom:'16px'}},'🖼 앨범에서 사진 불러오기');
    const fileInput = h('input',{type:'file',accept:'image/*',style:{display:'none'}});
    fileInput.onchange=e=>{const f=e.target.files[0];if(f){compressImage(f,2000,0.85).then(src=>{d2.bgPhoto=src;render();});}e.target.value='';};
    uploadBtn.onclick=()=>fileInput.click();
    wrap.appendChild(uploadBtn);
    wrap.appendChild(fileInput);
    return;
  }

  if(d2.mode==='draw' || d2.bgPhoto){
    const canvasWrap = h('div',{style:{position:'relative',marginBottom:'12px',borderRadius:'10px',overflow:'hidden',border:`1px solid ${T.border2}`,touchAction:'none'}});
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'display:block;touch-action:none;-webkit-touch-callout:none;user-select:none';
    canvasWrap.appendChild(canvas);
    wrap.appendChild(canvasWrap);

    requestAnimationFrame(()=>{
      const w = canvasWrap.getBoundingClientRect().width;
      const cH = Math.round(w*0.75);
      sketchCanvasSize = {w:w,h:cH};
      const dpr = 2;
      canvas.width = w*dpr; canvas.height = cH*dpr;
      canvas.style.width = w+'px'; canvas.style.height = cH+'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr,dpr);

      var toPx = function(p){ return {x:p.x*w/100, y:p.y*cH/100}; };
      var toPct = function(px,py){ return {x:px*100/w, y:py*100/cH}; };

      var bgImg = null;
      if(d2.mode==='photo' && d2.bgPhoto){ bgImg=new Image(); bgImg.src=d2.bgPhoto; }

      var drawCanvas = function(save){
        ctx.setTransform(dpr,0,0,dpr,0,0);
        // Always use light colors for consistency (light mode sketch)
        var CK_BG='#f0f0f0', CK_GRID='#ddd', CK_WALL='#333';
        if(bgImg && bgImg.complete){
          var s=Math.min(w/bgImg.width,cH/bgImg.height);
          ctx.drawImage(bgImg,(w-bgImg.width*s)/2,(cH-bgImg.height*s)/2,bgImg.width*s,bgImg.height*s);
        } else {
          ctx.fillStyle=CK_BG; ctx.fillRect(0,0,w,cH);
          ctx.strokeStyle=CK_GRID; ctx.lineWidth=0.5;
          for(var gx=0;gx<=w;gx+=15){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,cH);ctx.stroke();}
          for(var gy=0;gy<=cH;gy+=15){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(w,gy);ctx.stroke();}
        }
        // Draw walls & polygon only in draw mode (not photo mode)
        if(d2.mode!=='photo'){
          // Legacy walls
          (d2.walls||[]).forEach(function(wall){
            ctx.strokeStyle=CK_WALL; ctx.lineWidth=6; ctx.lineCap='round';
            ctx.beginPath(); ctx.moveTo(wall.x1,wall.y1); ctx.lineTo(wall.x2,wall.y2); ctx.stroke();
          });
          // Polygon
          var poly = d2.polygon;
          if(poly && poly.length>=3){
            ctx.strokeStyle=CK_WALL; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round';
            ctx.beginPath();
            var p0=toPx(poly[0]); ctx.moveTo(p0.x,p0.y);
            for(var i=1;i<poly.length;i++){var p=toPx(poly[i]);ctx.lineTo(p.x,p.y);}
            ctx.closePath(); ctx.stroke();
          }
        }
        if(save && (!d2.drawing || d2.drawing.startsWith('data:'))) d2.drawing = canvas.toDataURL();
        // Vertex handles (draw mode only)
        if(d2.mode!=='photo'){
          var poly = d2.polygon;
          if(sketchTool==='wall' && poly){
            for(var i=0;i<poly.length;i++){
              var p=toPx(poly[i]);
              ctx.beginPath(); ctx.arc(p.x,p.y,10,0,Math.PI*2);
              ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fill();
              ctx.strokeStyle='#333'; ctx.lineWidth=2.5; ctx.stroke();
            }
            for(var i=0;i<poly.length;i++){
              var c=toPx(poly[i]), n=toPx(poly[(i+1)%poly.length]);
              var mx=(c.x+n.x)/2, my=(c.y+n.y)/2;
              ctx.beginPath(); ctx.arc(mx,my,9,0,Math.PI*2);
              ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fill();
              ctx.strokeStyle=CK_WALL; ctx.lineWidth=1.5;
              ctx.beginPath(); ctx.moveTo(mx-4,my); ctx.lineTo(mx+4,my); ctx.stroke();
              ctx.beginPath(); ctx.moveTo(mx,my-4); ctx.lineTo(mx,my+4); ctx.stroke();
            }
          }
          if(sketchTool==='eraser' && poly && poly.length>3){
            for(var i=0;i<poly.length;i++){
              var p=toPx(poly[i]);
              ctx.beginPath(); ctx.arc(p.x,p.y,12,0,Math.PI*2);
              ctx.strokeStyle='#f55'; ctx.lineWidth=2; ctx.stroke();
            }
          }
        }
      };

      if(bgImg && !bgImg.complete){ bgImg.onload=function(){drawCanvas(true);}; }
      else { drawCanvas(true); }

      // 90 degree snap
      var snapAngle = function(idx){
        var poly=d2.polygon, len=poly.length; if(len<3) return;
        var prev=toPx(poly[(idx-1+len)%len]), curr=toPx(poly[idx]), next=toPx(poly[(idx+1)%len]);
        var TR=7*Math.PI/180, sx=curr.x, sy=curr.y;
        var dx1=sx-prev.x, dy1=sy-prev.y;
        if(dx1*dx1+dy1*dy1>100){
          var a1=Math.atan2(Math.abs(dy1),Math.abs(dx1));
          if(a1<TR) sy=prev.y; else if(a1>Math.PI/2-TR) sx=prev.x;
        }
        var dx2=sx-next.x, dy2=sy-next.y;
        if(dx2*dx2+dy2*dy2>100){
          var a2=Math.atan2(Math.abs(dy2),Math.abs(dx2));
          if(a2<TR) sy=next.y; else if(a2>Math.PI/2-TR) sx=next.x;
        }
        d2.polygon[idx]=toPct(sx,sy);
      };

      var getXY = function(e){
        var rect=canvas.getBoundingClientRect();
        var cx,cy;
        if(e.touches && e.touches.length>0){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}
        else if(e.changedTouches && e.changedTouches.length>0){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}
        else{cx=e.clientX;cy=e.clientY;}
        return {x:cx-rect.left, y:cy-rect.top};
      };

      var dragIdx=-1, dragPrev=null;

      var onDown = function(e){
        var pos=getXY(e);
        if(sketchTool==='wall' && d2.polygon){
          for(var i=0;i<d2.polygon.length;i++){
            var vp=toPx(d2.polygon[i]);
            var dx=pos.x-vp.x, dy=pos.y-vp.y;
            if(Math.sqrt(dx*dx+dy*dy)<30){
              dragIdx=i;
              dragPrev=JSON.parse(JSON.stringify(d2.polygon));
              e.preventDefault();
              return;
            }
          }
        }
      };

      var onMove = function(e){
        if(sketchTool==='wall' && dragIdx>=0){
          e.preventDefault();
          var pos=getXY(e);
          d2.polygon[dragIdx]=toPct(pos.x,pos.y);
          snapAngle(dragIdx);
          drawCanvas(false);
        }
      };

      var onUp = function(e){
        var pos=getXY(e);
        if(sketchTool==='wall' && dragIdx>=0){
          snapAngle(dragIdx);
          sketchActionHistory.push({type:'polygon',data:dragPrev});
          dragIdx=-1; dragPrev=null;
          if(d2.drawing&&!d2.drawing.startsWith('data:')) d2.drawing=null;
          render(); return;
        }
        if(sketchTool==='wall' && d2.polygon){
          for(var i=0;i<d2.polygon.length;i++){
            var c=toPx(d2.polygon[i]), n=toPx(d2.polygon[(i+1)%d2.polygon.length]);
            var mx=(c.x+n.x)/2, my=(c.y+n.y)/2;
            var dx=pos.x-mx, dy=pos.y-my;
            if(Math.sqrt(dx*dx+dy*dy)<25){
              var prev=JSON.parse(JSON.stringify(d2.polygon));
              d2.polygon.splice(i+1,0,toPct(mx,my));
              sketchActionHistory.push({type:'polygon',data:prev});
              if(d2.drawing&&!d2.drawing.startsWith('data:')) d2.drawing=null;
              render(); return;
            }
          }
        }
        if(sketchTool==='door'){
          var rect=canvas.getBoundingClientRect();
          var xP=(pos.x/rect.width)*100, yP=(pos.y/rect.height)*100;
          var did=Date.now();
          d2.doors=[].concat(d2.doors||[],[{id:did,x:xP,y:yP}]);
          sketchActionHistory.push({type:'addDoor',id:did});
          if(d2.drawing&&!d2.drawing.startsWith('data:')) d2.drawing=null;
          render();
        }
        if(sketchTool==='pin'){
          var rect=canvas.getBoundingClientRect();
          var xP=(pos.x/rect.width)*100, yP=(pos.y/rect.height)*100;
          var pid=Date.now();
          var np={id:pid,type:sketchSelectedPin,x:xP,y:yP,note:''};
          d2.pins=[].concat(d2.pins||[],[np]);
          var fk=PIN_FACILITY_MAP[sketchSelectedPin];
          if(fk) data.facility[fk]={x:xP,y:yP};
          sketchActionHistory.push({type:'addPin',id:pid,pinType:sketchSelectedPin});
          if(d2.drawing&&!d2.drawing.startsWith('data:')) d2.drawing=null;
          render();
        }
        if(sketchTool==='eraser' && d2.mode!=='photo' && d2.polygon && d2.polygon.length>3){
          for(var i=0;i<d2.polygon.length;i++){
            var vp=toPx(d2.polygon[i]);
            var dx=pos.x-vp.x, dy=pos.y-vp.y;
            if(Math.sqrt(dx*dx+dy*dy)<25){
              var prev=JSON.parse(JSON.stringify(d2.polygon));
              d2.polygon.splice(i,1);
              sketchActionHistory.push({type:'polygon',data:prev});
              if(d2.drawing&&!d2.drawing.startsWith('data:')) d2.drawing=null;
              render(); return;
            }
          }
        }
      };

      canvas.addEventListener('touchstart',function(e){e.preventDefault();onDown(e);},{passive:false});
      canvas.addEventListener('touchmove',function(e){e.preventDefault();onMove(e);},{passive:false});
      canvas.addEventListener('touchend',function(e){e.preventDefault();onUp(e);});
      canvas.addEventListener('mousedown',onDown);
      canvas.addEventListener('mousemove',onMove);
      canvas.addEventListener('mouseup',onUp);

      // Door overlays
      (d2.doors||[]).forEach(function(dr){
        var el=document.createElement('div');
        el.style.cssText='position:absolute;left:'+dr.x+'%;top:'+dr.y+'%;transform:translate(-50%,-50%);font-size:22px;pointer-events:'+(sketchTool==='eraser'?'auto':'none')+';filter:drop-shadow(0 1px 3px rgba(0,0,0,0.4));cursor:'+(sketchTool==='eraser'?'pointer':'default')+';opacity:'+(sketchTool==='eraser'?'0.7':'1')+';animation:'+(sketchTool==='eraser'?'shake .5s infinite':'none');
        el.textContent='🚪';
        if(sketchTool==='eraser') el.onclick=function(ev){ev.stopPropagation();if(d2.drawing&&!d2.drawing.startsWith('data:'))d2.drawing=null;d2.doors=d2.doors.filter(function(d3){return d3.id!==dr.id;});sketchActionHistory.push({type:'eraseDoor',data:dr});render();};
        canvasWrap.appendChild(el);
      });
      // Pin overlays
      (d2.pins||[]).forEach(function(pin){
        var pt=PIN_TYPES.find(function(p){return p.id===pin.type;});
        var el=document.createElement('div');
        el.style.cssText='position:absolute;left:'+pin.x+'%;top:'+pin.y+'%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:'+(sketchTool==='eraser'?'auto':'none')+';cursor:'+(sketchTool==='eraser'?'pointer':'default')+';opacity:'+(sketchTool==='eraser'?'0.7':'1')+';animation:'+(sketchTool==='eraser'?'shake .5s infinite':'none');
        el.innerHTML='<div style="width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 1px 4px rgba(0,0,0,0.15);border:1px solid #ddd">'+(pt?pt.emoji:'')+'</div><div style="font-size:9px;color:#333;background:rgba(255,255,255,0.85);padding:1px 4px;border-radius:4px;margin-top:2px;white-space:nowrap;border:1px solid #ccc;font-weight:600">'+(pt?pt.label:'')+'</div>';
        if(sketchTool==='eraser') el.onclick=function(ev){ev.stopPropagation();if(d2.drawing&&!d2.drawing.startsWith('data:'))d2.drawing=null;var fk=PIN_FACILITY_MAP[pin.type];if(fk)data.facility[fk]=null;d2.pins=d2.pins.filter(function(p){return p.id!==pin.id;});sketchActionHistory.push({type:'erasePin',data:pin,pinType:pin.type});render();};
        canvasWrap.appendChild(el);
      });
    });

    // Toolbar
    // In photo mode, wall editing is not available — auto-switch tool
    if(d2.mode==='photo' && sketchTool==='wall') sketchTool='door';
    const toolbar = h('div',{style:{display:'flex',gap:'6px',marginBottom:'12px',flexWrap:'wrap'}});
    const mkToolBtn = (id,lb) => {
      const active = sketchTool===id;
      const btn = h('button',{style:{padding:'8px 14px',borderRadius:'8px',border:active?`1.5px solid ${T.accent}`:`1px solid ${T.chipBorder}`,background:active?T.chipActive:'transparent',color:active?T.chipActiveText:T.text2,fontSize:'12px',cursor:'pointer',fontWeight:active?'600':'400'}},lb);
      btn.onclick=()=>{sketchTool=id;render();};
      return btn;
    };
    if(d2.mode!=='photo') toolbar.appendChild(mkToolBtn('wall','✏️ 벽체 편집'));
    toolbar.appendChild(mkToolBtn('door','🚪 출입구'));
    toolbar.appendChild(mkToolBtn('pin','📍 설비'));
    toolbar.appendChild(mkToolBtn('eraser','🧹 지우기'));

    const undoBtn = h('button',{style:{padding:'8px 14px',borderRadius:'8px',border:`1px solid ${T.chipBorder}`,background:'transparent',color:T.text2,fontSize:'12px',cursor:'pointer'}},'↩ 되돌리기');
    undoBtn.onclick=()=>{
      if(!sketchActionHistory.length) return;
      if(d2.drawing && !d2.drawing.startsWith('data:')) d2.drawing = null;
      const last = sketchActionHistory.pop();
      if(last.type==='polygon') d2.polygon = last.data;
      else if(last.type==='addDoor') d2.doors=(d2.doors||[]).filter(dr=>dr.id!==last.id);
      else if(last.type==='addPin'){d2.pins=(d2.pins||[]).filter(p=>p.id!==last.id);const fk=PIN_FACILITY_MAP[last.pinType];if(fk)data.facility[fk]=null;}
      else if(last.type==='eraseDoor') d2.doors=[].concat(d2.doors||[],[last.data]);
      else if(last.type==='erasePin'){d2.pins=[].concat(d2.pins||[],[last.data]);const fk=PIN_FACILITY_MAP[last.pinType];if(fk)data.facility[fk]={x:last.data.x,y:last.data.y};}
      render();
    };
    toolbar.appendChild(undoBtn);

    if(d2.mode==='photo'&&d2.bgPhoto){
      const changeBtn = h('button',{style:{padding:'8px 14px',borderRadius:'8px',border:`1px solid ${T.chipBorder}`,background:'transparent',color:T.text5,fontSize:'12px',cursor:'pointer'}},'사진 변경');
      changeBtn.onclick=()=>{d2.bgPhoto=null;d2.drawing=null;d2.polygon=null;d2.walls=[];d2.doors=[];render();};
      toolbar.appendChild(changeBtn);
    }
    wrap.appendChild(toolbar);

    if(sketchTool==='wall') wrap.appendChild(h('div',{style:{fontSize:'12px',color:T.text5,marginBottom:'10px'}},'꼭지점을 드래그하여 벽체 수정 · + 버튼으로 꼭지점 추가 · 90° 자동 정렬'));
    if(sketchTool==='door') wrap.appendChild(h('div',{style:{fontSize:'12px',color:T.text5,marginBottom:'10px'}},'출입구 위치를 탭하세요'));
    if(sketchTool==='eraser') wrap.appendChild(h('div',{style:{fontSize:'12px',color:T.text5,marginBottom:'10px'}},d2.mode==='photo'?'흔들리는 스티커를 탭하여 삭제':'빨간 원(꼭지점) 또는 흔들리는 스티커를 탭하세요'));

    if(sketchTool==='pin'){
      const pinSel = h('div',{style:{marginBottom:'12px'}});
      pinSel.appendChild(h('div',{style:{fontSize:'12px',color:T.text5,marginBottom:'6px'}},'설비 종류 선택 후 캔버스 탭'));
      const pinChips = h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}});
      PIN_TYPES.forEach(p=>{
        const active = sketchSelectedPin===p.id;
        const btn = h('button',{style:{padding:'8px 14px',borderRadius:'20px',border:active?`1.5px solid ${T.accent}`:`1px solid ${T.chipBorder}`,background:active?T.chipActive:T.chipInactive,color:active?T.chipActiveText:T.chipInactiveText,fontSize:'13px',cursor:'pointer',fontWeight:active?'600':'400'}},`${p.emoji} ${p.label}`);
        btn.onclick=()=>{sketchSelectedPin=p.id;render();};
        pinChips.appendChild(btn);
      });
      pinSel.appendChild(pinChips);
      wrap.appendChild(pinSel);
    }

    if((d2.pins||[]).length>0){
      const pinsList = h('div',{style:{marginTop:'8px'}});
      pinsList.appendChild(h('div',{style:{fontSize:'13px',color:T.text2,marginBottom:'8px',fontWeight:'500'}},'배치된 핀'));
      (d2.pins||[]).forEach(pin=>{
        const pt=PIN_TYPES.find(p=>p.id===pin.type);
        const row = h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px',padding:'8px 10px',borderRadius:'8px',background:T.cardBg,border:`1px solid ${T.cardBorder}`}});
        row.appendChild(h('span',{style:{fontSize:'18px'}},pt?.emoji||''));
        const inp = h('input',{type:'text',style:{...inputStyle(),flex:'1',fontSize:'13px',padding:'6px 10px',border:'none',background:'transparent'},placeholder:`${pt?.label||''} 메모`});
        inp.value=pin.note||'';
        inp.oninput=e=>{pin.note=e.target.value;};
        row.appendChild(inp);
        const rmBtn = h('button',{style:{width:'24px',height:'24px',borderRadius:'6px',border:'none',background:T.border3,color:T.text2,fontSize:'12px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},'✕');
        rmBtn.onclick=()=>{if(d2.drawing&&!d2.drawing.startsWith('data:'))d2.drawing=null;const fk=PIN_FACILITY_MAP[pin.type];if(fk)data.facility[fk]=null;d2.pins=d2.pins.filter(p=>p.id!==pin.id);render();};
        row.appendChild(rmBtn);
        pinsList.appendChild(row);
      });
      wrap.appendChild(pinsList);
    }

    wrap.appendChild(h('div',{style:{fontSize:'11px',color:T.text4,marginTop:'8px'}},(d2.mode!=='photo'?'꼭지점 '+(d2.polygon||[]).length+'개 · ':'')+'출입구 '+(d2.doors||[]).length+'개 · 설비 '+(d2.pins||[]).length+'개'));
  }
}

// ==================== PDF Export ====================
function exportPDF(){
  const info = data.info;
  const dateStr = (info.date||'').replace(/[^0-9]/g,'');
  const shortDate = dateStr.length>=8 ? dateStr.slice(2) : (dateStr.length>=6 ? dateStr : '날짜미정');
  const pdfTitle = `${shortDate} ${info.siteName||'미입력'} 실측보고서`;

  // Show loading overlay
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999';
  overlay.innerHTML = '<div style="background:#fff;padding:24px 40px;border-radius:16px;font-size:15px;font-weight:600;color:#333;box-shadow:0 8px 32px rgba(0,0,0,0.2)">📄 이미지 로딩 중...</div>';
  document.body.appendChild(overlay);

  // Temporarily switch to light theme for printing
  const origTheme = T;
  const origTitle = document.title;
  const wasLight = (T === themes.light);
  if(!wasLight){
    T = themes.light;
    render();
  }

  document.title = pdfTitle;

  // Wait for DOM to settle, then wait for ALL images to load
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const app = document.getElementById('app');
      const imgs = app ? Array.from(app.querySelectorAll('img')) : [];

      // Create promises for all images
      const imgPromises = imgs.map(img => {
        if(img.complete && img.naturalWidth > 0) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve; // don't block on failed images
          // Force reload if src is set but not loading
          if(img.src && !img.complete){
            const src = img.src;
            img.src = '';
            img.src = src;
          }
        });
      });

      // Wait for all images (with 8s timeout)
      const timeout = new Promise(resolve => setTimeout(resolve, 8000));
      Promise.race([Promise.all(imgPromises), timeout]).then(()=>{
        // Update overlay text
        overlay.querySelector('div').textContent = '📄 PDF 저장 화면 열기...';

        // Small extra delay for rendering
        setTimeout(()=>{
          const saved = [];
          if(app){
            app.querySelectorAll('*').forEach(el=>{
              const s = el.style;
              if(s.height==='100vh'||s.minHeight==='100vh'||s.overflow==='hidden'||s.overflowY==='auto'||s.position==='fixed'){
                saved.push({el, height:s.height, minHeight:s.minHeight, overflow:s.overflow, overflowY:s.overflowY, position:s.position, display:s.display});
                if(s.position==='fixed') s.display='none';
                else { s.height='auto'; s.minHeight='0'; s.overflow='visible'; s.overflowY='visible'; }
              }
            });
            saved.push({el:app, height:app.style.height, overflow:app.style.overflow});
            app.style.height='auto';
            app.style.overflow='visible';
          }

          const origHtml = document.documentElement.style.cssText;
          const origBody = document.body.style.cssText;
          document.documentElement.style.cssText += ';height:auto!important;overflow:visible!important;background:#fff!important';
          document.body.style.cssText += ';height:auto!important;overflow:visible!important;background:#fff!important';

          // Remove overlay before print
          overlay.remove();

          window.print();

          document.title = origTitle;
          document.documentElement.style.cssText = origHtml;
          document.body.style.cssText = origBody;
          saved.forEach(({el,...styles})=>{
            Object.entries(styles).forEach(([k,v])=>{ if(v!==undefined) el.style[k]=v; });
          });
          if(!wasLight){
            T = origTheme;
            render();
          }
        }, 300);
      });
    });
  });
}

  photoSec.appendChild(makePhotos(data.photos.interior,'내부'));
  if(data.photos.video){
    const m = data.photos.video.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
    if(m){
      const vd = h('div',{style:{marginTop:'12px'},'data-pdf-hide':'1'});
      vd.innerHTML = `<div style="font-size:12px;color:${T.text5};margin-bottom:8px;font-weight:600">동영상</div><div style="border-radius:10px;overflow:hidden;aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/${m[1]}" style="width:100%;height:100%;border:none" allowfullscreen></iframe></div>`;
      photoSec.appendChild(vd);
    }
  }
  inner.appendChild(photoSec);

  // === Fire ===
  const fireSec = h('div',{style:secStyle,'data-print-section':'1','data-page-break':'1'});
  fireSec.appendChild(secTitle('2','소방완비 대상여부'));
  fireSec.appendChild(makeRow('완비대상 여부',data.fire.compliance));
  fireSec.appendChild(makeRow('스프링클러 여부',data.fire.sprinkler));
  const fireNotes = [...(data.fire.notesTags||[]),data.fire.notesCustom].filter(Boolean);
  if(fireNotes.length){
    const fnRow = h('div',{style:{padding:'10px 0',borderBottom:`1px solid ${T.border}`,fontSize:'14px',breakInside:'avoid',pageBreakInside:'avoid'}});
    fnRow.innerHTML = '<div style="color:'+T.text3+';font-size:12px;margin-bottom:4px">기타 특이사항</div>';
    fireNotes.forEach(function(note){
      fnRow.innerHTML += '<div style="color:'+T.text+';font-size:15px;line-height:1.8;font-weight:500">· '+note+'</div>';
    });
    fireSec.appendChild(fnRow);
  }
  inner.appendChild(fireSec);

  // === Sketch + facility pins ===
  const sketchPinTypes = new Set((data.sketch.pins||[]).map(p=>p.type));
  const facPinDefs = [
    {pin:data.facility.waterMeterPin,emoji:'💧',label:'수도계량기',type:'water'},
    {pin:data.facility.waterSupplyPin,emoji:'🚰',label:'급수',type:'supply'},
    {pin:data.facility.drainagePin,emoji:'🕳',label:'배수',type:'drain'},
    {pin:data.facility.ductPin,emoji:'💨',label:'덕트',type:'duct'},
    {pin:data.facility.gasEntryPin,emoji:'🔥',label:'가스배관',type:'gas'},
    {pin:data.facility.gasHeaterPin,emoji:'♨️',label:'가스온수기',type:'heater'}
  ];
  const facPins = facPinDefs.filter(p=>p.pin&&!sketchPinTypes.has(p.type));

  if(data.sketch.drawing || (data.sketch.pins||[]).length>0 || (data.sketch.doors||[]).length>0 || facPins.length>0){
    const skSec = h('div',{style:secStyle,'data-print-section':'1'});
    const skTitle = secTitle('','설비 요약 배치도 · 참고용');
    skSec.appendChild(skTitle);
    if(data.sketch.drawing){
      const imgWrap = h('div',{style:{position:'relative',borderRadius:'10px',overflow:'hidden',marginBottom:'12px',background:'#f0f0f0'},'data-sketch-wrap':'1'});
      imgWrap.innerHTML = `<img src="${data.sketch.drawing}" style="width:100%;display:block">`;
      (data.sketch.doors||[]).forEach(dr=>{
        imgWrap.innerHTML += `<div style="position:absolute;left:${dr.x}%;top:${dr.y}%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center"><span style="font-size:18px">🚪</span><div style="font-size:9px;color:#333;background:rgba(255,255,255,0.85);padding:1px 5px;border-radius:4px;margin-top:1px;white-space:nowrap;font-weight:600;border:1px solid #ccc">출입구</div></div>`;
      });
      (data.sketch.pins||[]).forEach(pin=>{
        const pt=PIN_TYPES.find(p=>p.id===pin.type);
        imgWrap.innerHTML += `<div style="position:absolute;left:${pin.x}%;top:${pin.y}%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center"><div style="width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,0.15);border:1px solid #ddd">${pt?.emoji||''}</div><div style="font-size:9px;color:#333;background:rgba(255,255,255,0.85);padding:1px 5px;border-radius:4px;margin-top:2px;white-space:nowrap;font-weight:600;border:1px solid #ccc">${pt?.label||''}</div></div>`;
      });
      facPins.forEach(fp=>{
        imgWrap.innerHTML += `<div style="position:absolute;left:${fp.pin.x}%;top:${fp.pin.y}%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center"><div style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,0.15);border:1px solid #ddd">${fp.emoji}</div><div style="font-size:9px;color:#333;background:rgba(255,255,255,0.85);padding:1px 5px;border-radius:4px;margin-top:2px;white-space:nowrap;font-weight:600;border:1px solid #ccc">${fp.label}</div></div>`;
      });
      skSec.appendChild(imgWrap);
    }
    (data.sketch.pins||[]).filter(p=>p.note).forEach(pin=>{
      const pt=PIN_TYPES.find(p=>p.id===pin.type);
      skSec.appendChild(makeRow(`${pt?.emoji} ${pt?.label}`,pin.note));
    });
    inner.appendChild(skSec);
  }

  // === Facility ===
  const facSec = h('div',{style:secStyle,'data-print-section':'1'});
  facSec.appendChild(secTitle('3','기초설비 관련'));
  facSec.appendChild(makeRow('수도계량기 위치',data.facility.waterMeter,data.facility.waterMeterPhotos));
  facSec.appendChild(makeRow('급수 위치',data.facility.waterSupply,data.facility.waterSupplyPhotos));
  facSec.appendChild(makeRow('배수 위치, 관경',data.facility.drainage,data.facility.drainagePhotos));
  const ductVal = [...(data.facility.ductTags||[]),data.facility.ductCustom].filter(Boolean).join(', ');
  facSec.appendChild(makeRow('덕트 체크',ductVal,data.facility.ductPhotos));
  facSec.appendChild(makeRow('가스배관 인입지점',data.facility.gasEntry,data.facility.gasEntryPhotos));
  facSec.appendChild(makeRow('가스온수기',data.facility.gasHeater,data.facility.gasHeaterPhotos));
  facSec.appendChild(makeRow('기타 특이사항',data.facility.notes,data.facility.notesPhotos));
  inner.appendChild(facSec);

  // === Electric ===
  const elecSec = h('div',{style:secStyle,'data-print-section':'1'});
  elecSec.appendChild(secTitle('4','전기, 냉난방'));
  const panelVal = (data.electric.panelEntries||[]).map(e=>`${e.phase} ${e.amps}A`).filter(e=>e.includes('A')).join(' + ');
  const panelLoc = data.electric.panelLocation||'';
  const panelDisplay = [panelVal, panelLoc].filter(Boolean).join(' / ');
  elecSec.appendChild(makeRow('분전함/계량기',panelDisplay,data.electric.panelPhotos));
  elecSec.appendChild(makeRow('냉난방기/실외기',data.electric.hvac,data.electric.hvacPhotos));
  elecSec.appendChild(makeRow('기타 특이사항',data.electric.notes,data.electric.notesPhotos));
  inner.appendChild(elecSec);

  // === Construction ===
  const conSec = h('div',{style:secStyle,'data-print-section':'1'});
  conSec.appendChild(secTitle('5','공사관련 체크사항'));
  const parkingDisplay = [data.construction.parking, data.construction.parkingDetail].filter(Boolean).join(' / ');
  conSec.appendChild(makeRow('주차관리',parkingDisplay,data.construction.parkingPhotos));
  if(data.construction.nearbyParkingAddr||data.construction.nearbyParkingRate){
    const parkRow = h('div',{style:{padding:'10px 0',borderBottom:`1px solid ${T.border}`,fontSize:'14px'}});
    parkRow.innerHTML = `<div style="color:${T.text3};font-size:12px;margin-bottom:4px">근처 주차장</div><div style="color:${T.text};font-size:15px;line-height:1.5;font-weight:500">${data.construction.nearbyParkingAddr||'—'} / 일 ${data.construction.nearbyParkingRate||'—'}원</div>`;
    if(data.construction.nearbyParkingAddr){
      parkRow.innerHTML += makeMapLink(data.construction.nearbyParkingAddr);
      var pd = document.createElement('div');
      pd.style.cssText = 'width:100%;height:140px;border-radius:10px;margin-top:10px;overflow:hidden;pointer-events:none';
      var pf = document.createElement('iframe');
      pf.src = 'https://maps.google.com/maps?q=' + encodeURIComponent(data.construction.nearbyParkingAddr.split(' ').slice(0,4).join(' ')) + '&t=m&z=16&output=embed&hl=ko';
      pf.style.cssText = 'width:100%;height:100%;border:none';
      pf.loading = 'lazy';
      pd.appendChild(pf);
      parkRow.appendChild(pd);
    }
    conSec.appendChild(parkRow);
  }
  conSec.appendChild(makeRow('자재입고 동선',data.construction.materialRoute,data.construction.materialRoutePhotos));
  conSec.appendChild(makeRow('계단/E/V',data.construction.stairElevator,data.construction.stairElevatorPhotos));
  conSec.appendChild(makeRow('건물 보양',data.construction.buildingProtection,data.construction.buildingProtectionPhotos));
  conSec.appendChild(makeRow('기타 특이사항',data.construction.notes,data.construction.notesPhotos));
  inner.appendChild(conSec);

  // === Etc ===
  const etcSec = h('div',{style:secStyle,'data-print-section':'1'});
  etcSec.appendChild(secTitle('6','기타'));
  etcSec.appendChild(makeRow('불법건축물',data.etc.illegalBuilding,data.etc.illegalBuildingPhotos));
  etcSec.appendChild(makeRow('건물 누수',data.etc.leak,data.etc.leakPhotos));
  etcSec.appendChild(makeRow('기타',data.etc.notes,data.etc.notesPhotos));
  inner.appendChild(etcSec);

  // === Measure ===
  const mSec = h('div',{style:secStyle,'data-print-section':'1'});
  mSec.appendChild(secTitle('7','실측도'));
  mSec.appendChild(makeRow('천장고(슬라브)',data.measure.ceilingSlab?data.measure.ceilingSlab+'mm':''));
  mSec.appendChild(makeRow('천장고(하리)',data.measure.ceilingBeam?data.measure.ceilingBeam+'mm':''));
  mSec.appendChild(makeRow('천장고(천장마감)',data.measure.ceilingFinish?data.measure.ceilingFinish+'mm':''));
  mSec.appendChild(makeRow('마감 평수',data.measure.area?data.measure.area+'py':''));
  const measurePhotos = makePhotos(data.measure.floorPlan,'실측도면');
  if(measurePhotos.nodeType===1) measurePhotos.setAttribute('data-measure-photo','1');
  mSec.appendChild(measurePhotos);
  inner.appendChild(mSec);

  // Footer
  const footer = h('div',{style:{textAlign:'center',padding:'24px 0',marginTop:'8px'},'data-report-footer':'1'});
  footer.innerHTML = `<div style="font-size:11px;color:${T.text4};letter-spacing:1px">iggg studio</div>`;
  inner.appendChild(footer);

  // Save / Share buttons (only in edit mode)
  if(!viewMode){
    const btnArea = h('div',{style:{position:'fixed',bottom:'0',left:'0',right:'0',padding:'16px 20px',paddingBottom:'max(16px, env(safe-area-inset-bottom))',background:T.gradientBottom,display:'flex',gap:'10px',zIndex:'20'}});
    const backBtn2 = h('button',{style:{flex:'0 0 auto',padding:'14px 20px',borderRadius:'12px',border:`1px solid ${T.border3}`,background:'transparent',color:T.text2,fontSize:'15px',cursor:'pointer',fontWeight:'500'}},'편집');
    backBtn2.onclick=()=>{showReport=false;navigateTo('wizard');};
    btnArea.appendChild(backBtn2);

    const pdfBtn = h('button',{style:{flex:'0 0 auto',padding:'14px 20px',borderRadius:'12px',border:`1px solid ${T.border3}`,background:'transparent',color:T.text2,fontSize:'15px',cursor:'pointer',fontWeight:'500'}},'📄 PDF');
    pdfBtn.onclick=exportPDF;
    btnArea.appendChild(pdfBtn);

    const saveBtn = h('button',{style:{flex:'1',padding:'14px 0',borderRadius:'12px',border:'none',background:T.accent,color:T.accentText,fontSize:'15px',fontWeight:'700',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'},'data-save-btn':'1'});
    if(saving){
      saveBtn.innerHTML = `<div style="width:18px;height:18px;border:2px solid ${T.accentText};border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div> ${savingMsg}`;
      saveBtn.style.opacity='0.7';
      saveBtn.style.pointerEvents='none';
    } else {
      saveBtn.textContent='저장 & 공유';
      saveBtn.onclick=saveReport;
    }
    btnArea.appendChild(saveBtn);

    inner.style.paddingBottom = '100px';
    container.appendChild(inner);
    container.appendChild(btnArea);
  } else {
    // View mode: PDF button at bottom of content (not fixed)
    const viewBtnArea = h('div',{style:{padding:'24px 20px 40px',display:'flex',justifyContent:'center'},'data-pdf-hide':'1'});
    const viewPdfBtn = h('button',{style:{padding:'14px 28px',borderRadius:'12px',border:'1px solid #ccc',background:'#fff',color:'#333',fontSize:'15px',cursor:'pointer',fontWeight:'600',boxShadow:'0 2px 8px rgba(0,0,0,0.1)'}},'📄 PDF 저장');
    viewPdfBtn.onclick=exportPDF;
    viewBtnArea.appendChild(viewPdfBtn);
    inner.appendChild(viewBtnArea);
    container.appendChild(inner);
  }

  return container;
}

// ==================== History Navigation ====================
function navigateTo(view){
  currentView = view;
  history.pushState({view},'');
  render(true);
}

window.addEventListener('popstate', e => {
  const state = e.state;
  // Close lightbox if open
  const lb = document.querySelector('[style*="z-index: 9999"], [style*="z-index:9999"]');
  if(lb){ lb.remove(); return; }

  if(state && state.view){
    currentView = state.view;
    if(state.view === 'home'){ showReport=false; viewMode=false; }
    else if(state.view === 'wizard'){ showReport=false; }
    else if(state.view === 'report'){ showReport=true; }
    render();
  } else {
    currentView = 'home';
    showReport = false;
    viewMode = false;
    render();
  }
});

// ==================== Auto Save (localStorage) ====================
var AUTOSAVE_KEY = 'iggg_report_draft';

function autoSave(){
  try {
    var draft = {
      data: data,
      step: step,
      editingId: editingId,
      ts: Date.now()
    };
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(draft));
  } catch(e){}
}

function loadDraft(){
  try {
    var raw = localStorage.getItem(AUTOSAVE_KEY);
    if(!raw) return null;
    var draft = JSON.parse(raw);
    if(!draft.data || !draft.data.info) return null;
    // Ignore drafts older than 7 days
    if(Date.now() - draft.ts > 7*24*60*60*1000){ localStorage.removeItem(AUTOSAVE_KEY); return null; }
    return draft;
  } catch(e){ return null; }
}

function clearDraft(){
  try { localStorage.removeItem(AUTOSAVE_KEY); } catch(e){}
}

// Auto-save every 3 seconds when editing
setInterval(function(){
  if(currentView==='wizard' && isUnlocked) autoSave();
}, 3000);

// Set initial state
history.replaceState({view:'home'},'');

// ==================== Init ====================
render();
</script>
